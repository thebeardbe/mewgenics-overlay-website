<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access request · Bugbox</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<style>
  body { margin:0; background:#171614; color:#e8e4dc; font:16px system-ui, sans-serif;
         display:grid; place-items:center; min-height:100vh; text-align:center; }
  main { max-width:480px; padding:24px; }
  a { color:#c7b8e8; }
  .pill { display:inline-block; background:#24211d; border:1px solid #3a3731;
          border-radius:20px; padding:2px 12px; font-size:13px; color:#a49f92;
          margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1 style="margin-top:0">🐞 Bugbox</h1>
  <p>{{ message|safe }}</p>
  <span class="pill">status: {{ status }}</span>
  <p style="margin-top:22px"><a href="/login">Back to login</a></p>
</main>
</body>
</html>
