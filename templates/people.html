<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People · Bugbox</title>
<style>
  :root { --bg:#171614; --card:#24211d; --line:#3a3731; --text:#e8e4dc;
          --muted:#a49f92; --accent:#c62828; --good:#4caf50; --warn:#b26b0a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.5 system-ui, sans-serif; padding:24px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:16px; margin-bottom:14px; }
  .add { display:flex; gap:8px; margin-bottom:4px; }
  .add input { flex:1; padding:8px 10px; border:1px solid var(--line);
          border-radius:8px; background:#171614; color:var(--text); }
  .btn { background:#2e2a24; color:var(--text); border:1px solid var(--line);
         border-radius:6px; padding:6px 12px; cursor:pointer; }
  .btn.ok { color:#81c784; } .btn.no { color:#ff8a8a; }
  .tag { font-size:11px; padding:1px 8px; border-radius:10px; text-transform:uppercase; }
  .tag.owner { background:#3a2f16; color:#e6c874; }
  .tag.approved { background:#1d3a24; color:#81c784; }
  .tag.pending { background:#3a2f16; color:#e6c874; }
  .tag.denied { background:#3a1518; color:#ff8a8a; }
  .row { display:flex; gap:14px; align-items:center; flex-wrap:wrap; padding:6px 0;
         border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .row .name { font-weight:600; min-width:140px; }
  .row .meta { color:var(--muted); font-size:12px; flex:1; }
  .row .actions { display:flex; gap:6px; }
</style>
</head>
<body>
  <h1>🐞 Bugbox · People</h1>
  <div class="sub">Developer access. New GitHub sign-ins arrive as <b>pending</b> and stay locked
    until you approve them. Revoking or denying a user signs them out immediately.
    <a href="/admin" style="color:#c7b8e8;margin-left:8px">← tickets</a></div>

  <div class="card">
    <p style="margin:0 0 8px;color:var(--muted)">Pre-approve a GitHub login (they can sign in the
      moment they connect, no waiting):</p>
    <div class="add">
      <input id="gh_login" placeholder="github username" autocomplete="off">
      <button class="btn ok" onclick="addUser()">Pre-approve</button>
    </div>
  </div>

  <div id="list" class="card" style="padding:6px 16px"></div>

<script>
async function load() {
  const r = await fetch("/api/users");
  if (r.status === 401) { location.href = "/login"; return; }
  if (r.status === 403) { location.href = "/admin"; return; }
  const users = await r.json();
  document.getElementById("list").innerHTML = users.map(u => {
    const canChange = u.role !== "owner";
    const statusTag = `<span class="tag ${u.status}">${u.status}</span>`;
    const roleTag = u.role === "owner"
      ? '<span class="tag owner">owner</span>' : "";
    let actions = "";
    if (canChange) {
      actions = `<span class="actions">
        ${u.status !== "approved" ? `<button class="btn ok" data-id="${u.id}" data-s="approved">Approve</button>` : ""}
        ${u.status === "approved" ? `<button class="btn" data-id="${u.id}" data-s="pending">Revoke</button>` : ""}
        ${u.status !== "denied" ? `<button class="btn no" data-id="${u.id}" data-s="denied">Deny</button>` : ""}
        <button class="btn no" data-id="${u.id}" data-del="1">Remove</button>
      </span>`;
    }
    const meta = u.github_login ? `github: ${u.github_login}` : "local";
    return `<div class="row">
      <span class="name">${u.username.replace(/[<>&]/g, "")}</span>
      ${roleTag} ${statusTag}
      <span class="meta">${meta.replace(/[<>&]/g, "")}</span>
      ${actions}
    </div>`;
  }).join("");
  document.querySelectorAll("[data-id]").forEach(b => b.onclick = async () => {
    const id = b.dataset.id;
    if (b.dataset.del) {
      if (!confirm("Remove this user? Their sessions end immediately.")) return;
      await fetch(`/api/users/${id}/delete`, { method: "POST" });
    } else {
      await fetch(`/api/users/${id}/status`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "status=" + b.dataset.s,
      });
    }
    load();
  });
}

async function addUser() {
  const login = document.getElementById("gh_login").value.trim();
  if (!login) return;
  const r = await fetch("/api/users/github", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: "login=" + encodeURIComponent(login),
  });
  document.getElementById("gh_login").value = "";
  load();
}

load();
</script>
</body>
</html>
