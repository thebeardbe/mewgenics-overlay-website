<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bugbox · admin</title>
<style>
  :root { --bg:#171614; --card:#24211d; --card2:#2c2822; --line:#3a3731;
          --text:#e8e4dc; --muted:#a49f92; --accent:#c62828; --good:#81c784;
          --warn:#e0a458; --purple:#c7b8e8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.5 system-ui, sans-serif; }
  .app { display:grid; grid-template-columns:220px 1fr; min-height:100vh; }
  a { color:var(--purple); text-decoration:none; cursor:pointer; }

  /* sidebar */
  aside { background:#121110; border-right:1px solid var(--line);
          padding:18px 12px; display:flex; flex-direction:column; gap:2px; }
  aside .brand { font-size:17px; font-weight:700; padding:4px 10px 14px; }
  aside .group { color:var(--muted); font-size:10px; text-transform:uppercase;
          letter-spacing:.08em; padding:12px 10px 4px; }
  aside a { display:flex; align-items:center; gap:8px; padding:7px 10px;
          border-radius:8px; color:#d6d2c8; }
  aside a:hover { background:var(--card2); text-decoration:none; }
  aside a.active { background:var(--accent); color:#fff; font-weight:600; }
  aside a .cnt { margin-left:auto; font-size:11px; color:var(--muted);
          background:var(--card); border-radius:10px; padding:0 7px; }
  aside a.active .cnt { color:#fff; background:rgba(255,255,255,.18); }
  aside a.prim { font-size:15px; font-weight:600; padding:9px 10px; }
  aside nav.subnav { display:flex; flex-direction:column; gap:1px; }
  aside nav.subnav.closed { display:none; }
  aside nav.subnav a { padding:5px 10px 5px 26px; font-size:14px; }
  aside .chev { margin-left:auto; color:var(--muted); font-size:12px; }
  aside .spacer { flex:1; }
  aside a.out { color:var(--muted); }

  .tagsbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap;
          margin-top:10px; font-size:12px; color:var(--muted); }
  .tagsbar label { color:var(--muted); }
  .tagsbar select { background:#171614; color:var(--text);
          border:1px solid var(--line); border-radius:6px;
          padding:3px 6px; font:inherit; font-size:12px; }
  .tagsbar button { background:#2e2a24; border:1px solid var(--line);
          color:var(--text); border-radius:6px; padding:3px 10px;
          cursor:pointer; font:inherit; font-size:12px; }
  .tagsbar button:hover { border-color:var(--muted); }
  .tagsaved { color:var(--good); font-size:12px; }

  .cmts { margin-top:12px; border-top:1px dashed var(--line); padding-top:8px; }
  .cmt-head { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .cmt { background:#1a1815; border:1px solid var(--line); border-radius:8px;
         padding:8px 10px; margin-bottom:6px; }
  .cmt-meta { font-size:11px; color:var(--muted); }
  .cmt-meta .cmt-role { color:var(--purple); }
  .cmt-body { white-space:pre-wrap; font-size:13px; margin-top:3px; }
  .cmt .ev-text { color:#e3dccd; }
  .cmt.dim { opacity:.55; }
  .cmt-body.gone { text-decoration:line-through; color:var(--muted); }
  .cmt-del { float:right; background:none; border:0; color:var(--muted);
         cursor:pointer; font:inherit; font-size:12px; }
  .cmt-del:hover { color:#ff8a8a; }
  .cmt-add { display:flex; gap:6px; margin-top:4px; }
  .cmt-add textarea { flex:1; resize:vertical; min-height:38px; background:#171614;
         color:var(--text); border:1px solid var(--line); border-radius:6px;
         padding:6px 8px; font:inherit; font-size:13px; }
  .cmt-add button { background:#2e2a24; border:1px solid var(--line);
         color:var(--text); border-radius:6px; padding:4px 12px; cursor:pointer;
         font:inherit; font-size:13px; align-self:flex-end; }
  .cmt-add button:hover { border-color:var(--muted); }

  main { padding:22px 26px; min-width:0; }
  main h1 { font-size:21px; margin:0 0 2px; }
  main .sub { color:var(--muted); margin:0 0 16px; }
  .search { width:100%; max-width:420px; padding:8px 12px; margin-bottom:16px;
          background:#0f0e0c; color:var(--text); border:1px solid var(--line);
          border-radius:8px; }
  .ticket { background:var(--card); border:1px solid var(--line); border-radius:10px;
         padding:14px 16px; margin-bottom:12px; }
  .ticket .top { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  .id { color:var(--muted); font-family:ui-monospace, monospace; font-size:12px; }
  .sev { font-size:11px; padding:1px 8px; border-radius:10px; text-transform:uppercase; }
  .sev.low { background:#2e2a24; color:#c0b9a9; }
  .sev.medium { background:#3a2f16; color:#e6c874; }
  .sev.high { background:#5c2a12; color:#ffab73; }
  .sev.critical { background:#5c1216; color:#ff8a8a; }
  .title { font-weight:600; }
  .meta { color:var(--muted); font-size:12px; margin:4px 0 8px; }
  .summary { margin:4px 0; }
  .cause { color:var(--purple); font-size:13px; }
  .cat { font-size:11px; color:var(--muted); border:1px solid var(--line);
         padding:0 6px; border-radius:4px; }
  .prev { color:var(--muted); font-size:13px; margin:4px 0; white-space:nowrap;
          overflow:hidden; text-overflow:ellipsis; }
  .rels { margin:6px 0 2px; font-size:12px; color:var(--muted); }
  .rels .chip { display:inline-block; background:#2c2822; border:1px solid var(--line);
          border-radius:12px; padding:0 9px; margin:2px 4px 0 0; cursor:pointer; }
  .rels .chip:hover { border-color:var(--purple); color:var(--purple); }
  .toggle { display:inline-block; margin-top:6px; background:none; border:1px solid
          var(--line); color:var(--purple); border-radius:6px; padding:3px 10px;
          cursor:pointer; font:inherit; font-size:13px; }
  .toggle:hover { background:var(--card2); }
  .details { display:none; margin-top:8px; white-space:pre-wrap;
         font-family:ui-monospace, monospace; font-size:12px; color:#d8d3c8;
         background:#171614; border:1px solid var(--line); border-radius:8px;
         padding:10px; max-height:300px; overflow:auto; }
  .actions { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .actions button { background:#2e2a24; border:1px solid var(--line); color:var(--text);
         border-radius:6px; padding:4px 10px; cursor:pointer; font:inherit; font-size:13px; }
  .actions button.ok { color:var(--good); }
  .actions button.del { color:#ff8a8a; }
  .empty { color:var(--muted); text-align:center; padding:40px 0; }
  .status-tag { font-size:11px; padding:1px 8px; border-radius:10px;
         background:var(--line); }

  @media (max-width:720px) {
    .app { grid-template-columns:1fr; }
    aside { flex-direction:row; flex-wrap:wrap; align-items:center; }
    aside .brand, aside .spacer { display:none; }
    aside .group { display:none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">🐞 Bugbox</div>
    <div class="group">Menu</div>
    <a class="prim" href="#" id="tickets-trigger">🎫 Tickets
      <span class="chev" id="tickets-chev">▾</span></a>
    <nav class="subnav" id="tickets-sub">
      <a href="#" data-s="" class="active">📥 All <span class="cnt" id="cnt-all"></span></a>
      <a href="#" data-s="open">🟠 Open <span class="cnt" id="cnt-open"></span></a>
      <a href="#" data-s="triaged">🏷️ Triaged <span class="cnt" id="cnt-triaged"></span></a>
      <a href="#" data-s="fixed">✅ Fixed <span class="cnt" id="cnt-fixed"></span></a>
      <a href="#" data-s="wontfix">🚫 Won't fix <span class="cnt" id="cnt-wontfix"></span></a>
      <a href="#" data-s="duplicate">🔁 Duplicates <span class="cnt" id="cnt-duplicate"></span></a>
    </nav>
    {people_link}
    <div class="spacer"></div>
    <div class="group">Account</div>
    <a href="/report" class="out">📝 Public report page</a>
    <a href="/logout" class="out">↪ Sign out</a>
  </aside>

  <main>
    <h1>🐞 Bugbox</h1>
    <p class="sub" id="heading">Reports for Mewgenics Breeding Overlay</p>
    <input class="search" id="search" type="search"
           placeholder="Search titles, bodies, names, logs, #ids…" autocomplete="off">
    <div id="list"></div>
  </main>
</div>

<script>
const el = document.getElementById("list");
const searchEl = document.getElementById("search");
let tickets = [];
let current = "";
const SEVERITIES = ["low", "medium", "high", "critical"];
const CATEGORIES = ["parser", "save", "crash", "ui", "breeding",
                    "donations", "other"];

function esc(s) {
  return (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;",
    ">": "&gt;", '"': "&quot;" }[c]));
}
function ago(ts) {
  const m = Math.round((Date.now() / 1000 - ts) / 60);
  if (m < 1) return "just now";
  if (m < 60) return m + "m ago";
  const h = Math.round(m / 60);
  return h < 24 ? h + "h ago" : Math.round(h / 24) + "d ago";
}

const ACT_ICONS = { created: "📝", status: "🔁", tags: "🏷️",
                     link: "🔗", comment: "💬", comment_removed: "🗑️" };
function actRow(ev, rid) {
  const ic = ACT_ICONS[ev.kind] || "•";
  const who = esc(ev.actor || "system")
    + (ev.role ? ` <span class="cmt-role">${esc(ev.role)}</span>` : "");
  const delBtn = (ev.kind === "comment" && !ev.deleted)
    ? `<button type="button" class="cmt-del" data-del-cmt="${ev.seq}" data-id="${rid}" title="remove comment">✕</button>`
    : "";
  return `<div class="cmt ${ev.kind === "comment_removed" ? "dim" : ""}">
    <div class="cmt-meta">${ic} ${who} · ${ago(ev.ts)} ${delBtn}</div>
    ${ev.text ? `<span class="ev-text">${esc(ev.text)}</span>` : ""}
    ${ev.body ? `<div class="cmt-body${ev.deleted ? " gone" : ""}">${esc(ev.body)}</div>` : ""}
  </div>`;
}

async function load() {
  const r = await fetch("/api/tickets");
  if (r.status === 401) { location.href = "/login"; return; }
  tickets = await r.json();
  const counts = { "": tickets.length };
  tickets.forEach(t => counts[t.status] = (counts[t.status] || 0) + 1);
  document.querySelectorAll("aside a[data-s]").forEach(a => {
    const c = document.getElementById("cnt-" + (a.dataset.s || "all"));
    if (c) c.textContent = counts[a.dataset.s] || 0;
  });
  render();
}

function visible() {
  let q = searchEl.value.trim().toLowerCase();
  if (q.startsWith("#")) q = q.slice(1).trim();   // #demo02 -> demo02
  return tickets.filter(t => {
    if (current && t.status !== current) return false;
    if (!q) return true;
    return [t.title, t.body, t.log, t.name, t.id, t.app_version]
      .join(" ").toLowerCase().includes(q);
  });
}

function render() {
  const rows = visible();
  document.getElementById("heading").textContent =
    (current ? current : "all") + " · " + rows.length + " report(s)";
  if (!rows.length) {
    el.innerHTML = '<div class="empty">No reports here 🐱</div>';
    return;
  }
  el.innerHTML = rows.map(card).join("");
}

function card(t) {
  const a = t.analysis || {};
  const relList = Array.isArray(t.related) ? t.related : [];
  const dupes = (a.dupe_ids || []).length
    ? '<div class="cause">⚠ likely dupe of: ' + a.dupe_ids.map(x => "#" + esc(x)).join(", ") + "</div>" : "";
  const sevCls = ["low","medium","high","critical"].includes(a.severity) ? a.severity : "";
  const sevSel = (a.severity || "medium");
  const catSel = (a.category || t.category || "other");
  const act = (t.activity || []);
  const preview = a.summary ? ""
    : (t.body ? `<div class="prev">${esc(t.body.replace(/\s+/g, " ")).slice(0, 200)}${t.body.length > 200 ? "…" : ""}</div>` : "");
  const rels = relList.length
    ? '<div class="rels">🔗 related: ' + relList.map(x => `<span class="chip" data-goto="${esc(x)}">#${esc(x)}</span>`).join(" ") + "</div>" : "";
  return `<div class="ticket">
    <div class="top">
      <span class="id">#${t.id}</span>
      <span class="title">${esc(t.title)}</span>
      ${a.severity ? `<span class="sev ${sevCls}">${esc(a.severity)}</span>` : ""}
      <span class="cat">${esc(a.category || t.category)}</span>
      <span class="status-tag">${t.status}</span>
    </div>
    <div class="meta">${ago(t.created)} · v${esc(t.app_version || "?")} · patch ${esc(t.game_patch || "?")}${t.name ? " · " + esc(t.name) : ""}</div>
    ${preview}
    ${a.summary ? `<div class="summary">${esc(a.summary)}</div>` : ""}
    ${a.likely_cause ? `<div class="cause">🔧 ${esc(a.likely_cause)}</div>` : ""}
    ${dupes}
    ${rels}
    <div class="tagsbar" data-tid="${t.id}">
      <label>Tags:</label>
      <select data-tag="severity" aria-label="Severity">
        ${SEVERITIES.map(s => `<option value="${s}" ${s === sevSel ? "selected" : ""}>${s}</option>`).join("")}
      </select>
      <select data-tag="category" aria-label="Category">
        ${CATEGORIES.map(c => `<option value="${c}" ${c === catSel ? "selected" : ""}>${c}</option>`).join("")}
      </select>
      <button type="button" data-save-tags>💾 Save tags</button>
      <span class="tagsaved" hidden>saved ✓</span>
    </div>
    <div class="cmts">
      <div class="cmt-head">🧾 Activity (${act.length}) — every action is logged, append-only</div>
      ${act.map(ev => actRow(ev, t.id)).join("")}
      <div class="cmt-add">
        <textarea data-id="${t.id}" rows="2" placeholder="Add a comment / note…"></textarea>
        <button type="button" data-add-cmt="${t.id}">Add</button>
      </div>
    </div>
    <button class="toggle" type="button">▸ show details</button>
    <div class="details">${esc(t.body || "(no description)")}
${"=".repeat(30)}
${esc((t.log || "").slice(-6000))}</div>
    <div class="actions">
      <button data-act="triaged" data-id="${t.id}">Triaged</button>
      <button data-act="fixed" data-id="${t.id}">Fixed</button>
      <button data-act="duplicate" data-id="${t.id}">Duplicate</button>
      <button data-act="wontfix" data-id="${t.id}">Won't fix</button>
      <button data-link data-id="${t.id}">🔗 Link…</button>
      <button data-act="delete" data-id="${t.id}" class="del">Delete</button>
    </div>
  </div>`;
}

// event delegation: one listener handles toggles, links, tags, comments, actions
el.addEventListener("click", async (e) => {
  const addCmt = e.target.closest("[data-add-cmt]");
  if (addCmt) {
    const box = addCmt.parentElement.querySelector("textarea");
    const body = box.value.trim();
    if (!body) return;
    const r = await fetch(`/api/tickets/${addCmt.dataset.addCmt}/comments`, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "body=" + encodeURIComponent(body),
    });
    if (!r.ok) alert("Comment failed: " + (await r.json()).error);
    load();
    return;
  }
  const delCmt = e.target.closest("[data-del-cmt]");
  if (delCmt) {
    const r = await fetch(`/api/tickets/${delCmt.dataset.id}/comments/delete`, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "index=" + delCmt.dataset.delCmt,
    });
    if (!r.ok) alert("Delete failed: " + (await r.json()).error);
    load();
    return;
  }
  const saveTags = e.target.closest("[data-save-tags]");
  if (saveTags) {
    const bar = saveTags.closest(".tagsbar");
    const rid = bar.dataset.tid;
    const body = new URLSearchParams();
    body.set("severity", bar.querySelector('[data-tag="severity"]').value);
    body.set("category", bar.querySelector('[data-tag="category"]').value);
    const r = await fetch(`/api/tickets/${rid}/tags`, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString(),
    });
    if (!r.ok) alert("Save failed: " + (await r.json()).error);
    else {
      const ok = bar.querySelector(".tagsaved");
      ok.hidden = false;
      setTimeout(() => { ok.hidden = true; }, 1200);
    }
    load();
    return;
  }
  const toggle = e.target.closest("button.toggle");
  if (toggle) {
    const d = toggle.parentElement.querySelector(".details");
    const show = d.style.display !== "block";
    d.style.display = show ? "block" : "none";
    toggle.textContent = show ? "▾ hide details" : "▸ show details";
    return;
  }
  const goto = e.target.closest("[data-goto]");
  if (goto) {
    current = "";
    document.querySelectorAll("aside a").forEach(x => x.classList.remove("active"));
    document.querySelector("aside a[data-s='']").classList.add("active");
    searchEl.value = "#" + goto.dataset.goto;
    render();
    return;
  }
  const link = e.target.closest("[data-link]");
  if (link) {
    const rid = link.dataset.id;
    const target = prompt("Link this ticket to the main ticket (#id)", "");
    if (!target) return;
    const r = await fetch(`/api/tickets/${rid}/link`, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "target=" + encodeURIComponent(target.trim()),
    });
    if (!r.ok) alert("Link failed: " + (await r.json()).error);
    load();
    return;
  }
  const act = e.target.closest("[data-act]");
  if (act) {
    const rid = act.dataset.id;
    const a2 = act.dataset.act;
    await fetch(`/api/tickets/${rid}/${a2 === "delete" ? "delete" : "status"}`,
      a2 === "delete"
        ? { method: "POST" }
        : { method: "POST", headers: {"Content-Type": "application/x-www-form-urlencoded"},
            body: "status=" + a2 });
    load();
  }
});

document.querySelectorAll("aside a[data-s]").forEach(a => a.onclick = e => {
  e.preventDefault();
  document.querySelectorAll("aside a").forEach(x => x.classList.remove("active"));
  a.classList.add("active");
  current = a.dataset.s;
  render();
});
searchEl.addEventListener("input", render);
document.getElementById("tickets-trigger").addEventListener("click", (e) => {
  e.preventDefault();
  const sub = document.getElementById("tickets-sub");
  sub.classList.toggle("closed");
  document.getElementById("tickets-chev").textContent =
    sub.classList.contains("closed") ? "▸" : "▾";
});
load();
</script>
</body>
</html>
